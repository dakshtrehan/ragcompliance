[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ragcompliance"
dynamic = ["version"]
description = "Tamper evident audit trails and SOC 2 evidence for RAG pipelines (LangChain, LlamaIndex, OpenAI, Anthropic)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daksh Trehan" }]
keywords = [
    "rag", "langchain", "llamaindex", "openai", "anthropic", "compliance", "audit",
    "audit-log", "soc2", "iso27001", "hash-chain", "tamper-evident", "llm", "fintech", "healthtech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The core has no third party dependencies. Every integration and backend
# is an optional extra so an audit log never drags in a framework.
dependencies = []

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
llamaindex = ["llama-index-core>=0.10.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
supabase = ["supabase>=2.0.0"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.28"]
dashboard = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
sso = ["authlib>=1.3", "itsdangerous>=2.1"]
billing = ["stripe>=8.0.0"]
all = [
    "ragcompliance[langchain,llamaindex,openai,anthropic,supabase,postgres,s3,dashboard,sso,billing]",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
dev = [
    "ragcompliance[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "httpx>=0.27.0",
    "moto[s3]>=5.0",
    "python-dotenv>=1.0.0",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://www.dakshtrehan.com/ragcompliance/"
Documentation = "https://www.dakshtrehan.com/ragcompliance/docs.html"
Repository = "https://github.com/dakshtrehan/ragcompliance"
Issues = "https://github.com/dakshtrehan/ragcompliance/issues"
Changelog = "https://github.com/dakshtrehan/ragcompliance/blob/main/CHANGELOG.md"

[project.scripts]
ragcompliance = "ragcompliance.cli:main"
ragcompliance-verify = "ragcompliance.cli:verify_entry"
ragcompliance-selftest = "ragcompliance.selftest:main"
ragcompliance-soc2 = "ragcompliance.soc2:_main"

[tool.hatch.version]
path = "ragcompliance/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["ragcompliance"]

[tool.hatch.build.targets.sdist]
include = [
    "ragcompliance/**",
    "tests/**",
    "examples/**",
    "sql/**",
    "docs/*.md",
    "mkdocs.yml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "SECURITY.md",
    "supabase_schema.sql",
    "supabase_migration_billing.sql",
    "supabase_migration_v1.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:botocore.*",
]

[tool.coverage.run]
source = ["ragcompliance"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["docs", "site", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF100"]
ignore = [
    "E501",   # line length is enforced by the formatter where it matters; long strings allowed
    "B008",   # FastAPI Query(...) defaults in signatures
    "B904",   # raise ... from inside except is applied where it adds information
    "UP007",  # keep X | Y only in annotations (3.9 runtime compatibility is via __future__)
    "UP045",
    "SIM105", # explicit try/except/pass reads better than contextlib.suppress in hot paths
    "SIM108",
    "SIM117",
]

[tool.ruff.lint.isort]
known-first-party = ["ragcompliance"]

[tool.mypy]
python_version = "3.10"
files = ["ragcompliance"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true
